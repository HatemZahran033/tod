<script>
  let currentFit = localStorage.getItem("videoFit") || "fill"; // استرجاع أو افتراضي

  function applyVideoFit() {
    const video = document.querySelector(".jwplayer video");
    if (video) {
      video.style.objectFit = currentFit;
    }
  }

  function toggleAspectRatio() {
    currentFit = currentFit === "fill" ? "contain" : "fill";
    localStorage.setItem("videoFit", currentFit); // حفظ الوضع الجديد
    applyVideoFit();
  }

  function addAspectButton(playerInstance) {
    playerInstance.addButton(
      "https://img.icons8.com/ios-glyphs/24/ffffff/resize.png",
      "تبديل الأبعاد",
      toggleAspectRatio,
      "aspect-toggle"
    );
  }

  function forceFitLoop() {
    // تأكيد ضبط object-fit كل ثانية
    setInterval(applyVideoFit, 1000);
  }
  
  
  function addTelegramButton(playerInstance) {
        playerInstance.addButton(
            "https://img.icons8.com/ios-filled/25/ffffff/telegram-app.png",
            "تابعنا على تليجرام",
            () => {
                const tgDomain = "storm_connect";
                const telegramAppUrl = `tg://resolve?domain=${tgDomain}`;
                const telegramWebUrl = `https://t.me/${tgDomain}`;

                try {
                    const a = document.createElement("a");
                    a.href = telegramAppUrl;
                    a.target = "_blank";
                    a.rel = "noopener noreferrer";
                    document.body.appendChild(a);
                    a.click();

                    setTimeout(() => {
                        window.open(telegramWebUrl, "_blank");
                    }, 2000);
                } catch (e) {
                    window.open(telegramWebUrl, "_blank");
                }
            },
            "telegram-button"
        );
    }

    function addInfoButton(playerInstance) {
        playerInstance.addButton(
            "https://img.icons8.com/ios-filled/24/ffffff/info.png",
            "معلومات عن المشغل",
            showInfoPopup,
            "info-button"
        );
    }

    function showInfoPopup() {
        document.getElementById("info-popup").style.display = "block";
        document.getElementById("info-overlay").style.display = "block";
    }

    function closeInfoPopup() {
        document.getElementById("info-popup").style.display = "none";
        document.getElementById("info-overlay").style.display = "none";
    }

  function observeVideoChanges() {
    const observer = new MutationObserver(() => {
      applyVideoFit(); // أي تغيّر في DOM
    });

    observer.observe(document.body, {
      childList: true,
      subtree: true
    });
  }

  function setupFullscreenFix() {
    const events = [
      "fullscreenchange",
      "webkitfullscreenchange",
      "mozfullscreenchange",
      "msfullscreenchange"
    ];

    events.forEach(event => {
      document.addEventListener(event, () => {
        setTimeout(() => {
          applyVideoFit(); // بعد الدخول أو الخروج من fullscreen
        }, 200);
      });
    });
  }

  function setupPlayer() {
    const safeOffset = 6 * 60 * 60 * 1000;
    const duration = 12 * 60 * 60 * 1000;

    const startTimestamp = Date.now() - safeOffset;
    const endTimestamp = startTimestamp + duration;

    const fullURL = "https://ev-fuj-dxb-cdn-edge2.aws.playco.com/live/eds/StarzPlay_Series/DASH/StarzPlay_Series.mpd";
    

    const playerInstance = jwplayer("player");

    playerInstance.setup({
      playlist: [{
        sources: [{
          default: false,
          type: "dash",
          file: fullURL,
          drm: {
            clearkey: {
                  "keyId": "f9fd1dd7d0716e37456c3e17f27ee7ba", 
          "key": "3a00049c27da50ba56f081aef1b2d0b1" 
            }
          },
          label: "0"
        }]
      }],
      width: "100%",
      height: "100%",
      autostart: false,
      controls: true,
      cast: {},
      sharing: false
    });

    playerInstance.on('ready', function () {
      applyVideoFit();
      addAspectButton(playerInstance);
      addTelegramButton(playerInstance);
      addInfoButton(playerInstance); // ← زر المعلومات
    });

    playerInstance.on('play', applyVideoFit);
    playerInstance.on('fullscreen', applyVideoFit);
  }

  // تشغيل كل شيء
  setupPlayer();
  setInterval(setupPlayer, 50 * 60 * 1000); // إعادة التشغيل كل 50 دقيقة
  observeVideoChanges();  // راقب تغيّرات DOM
  setupFullscreenFix();   // دعم fullscreen
  forceFitLoop();         // فرض مستمر كل ثانية
  
  
</script>
